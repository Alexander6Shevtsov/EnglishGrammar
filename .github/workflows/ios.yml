name: iOS build and tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Build for iOS Simulator
        run: xcodebuild -project EnglishGrammar.xcodeproj -scheme EnglishGrammar -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Run tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone 16.*\(' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$DEVICE_ID" ]; then echo "No iPhone simulator available"; exit 1; fi
          xcodebuild -project EnglishGrammar.xcodeproj -scheme EnglishGrammar -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO test
